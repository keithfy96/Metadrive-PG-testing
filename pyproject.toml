[project]
name = "wingfin-scenariobank"
version = "0.1.0"
description = "A bank of procedurally generated MetaDrive scenarios, and the runner that scores a model against it."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "structlog>=24,<26",
  "typer>=0.12,<1",
]

[project.scripts]
scenariobank = "scenariobank.cli:app"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]
# MetaDrive. Opt-in, so `uv sync` stays fast for anything that does not need a simulator:
# `uv sync --group sim`.
#
# Pinned to a commit, not to `==0.4.3`. The reference checkout is 32 commits past that tag
# (`git describe` -> MetaDrive-0.4.3-32-g85e5dadc) and `metadrive.constants.EDITION` reports
# "MetaDrive v0.4.3" either way, so a version pin would let two machines run different
# simulators while every map in the bank claimed to be the same map. This is the same commit
# `converter-scenarionet` pins; a different commit means a different bank.
#
# `scenariobank doctor` exists to make this pin observable at run time rather than at
# resolve time -- it reads the SHA back out of the installed dist's `direct_url.json`.
#
# matplotlib is named here rather than relied on as a MetaDrive transitive dependency:
# `figures.py` draws the road network itself, because MetaDrive's top-down renderer has no
# notion of a route and the route is the whole question a Phase 1 figure answers.
# The local authoring studio (Phase 2c). Opt-in for the same reason `sim` is: a machine that only
# runs the CLI should not pay for a web stack.
#
# The studio deliberately does **not** depend on `sim`. It never imports MetaDrive -- the engine is
# a per-process singleton (`engine/engine_utils.py:36-59`), so a server holding one could serve
# exactly one simulator request and would die with it, a segfault rather than an exception. Every
# simulator command is a subprocess of this same CLI instead, which is also what keeps
# `docs/reference/commands.md` describing what actually runs.
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  # `starlette.testclient` needs an HTTP client of its own, and named here rather than in `dev`
  # so that `tests/unit/test_web.py` is skipped -- not broken -- on a machine without this group.
  # starlette >=1.6 prefers `httpx2` and warns on plain `httpx`; take the one it wants.
  "httpx2>=0.28",
]

sim = [
  "matplotlib>=3.8,<4",
  "metadrive-simulator @ git+https://github.com/metadriverse/metadrive.git@85e5dadc",
]

# The three packages MetaDrive's `image_on_cuda` path imports (a rendered frame stays on the GPU
# as a CuPy array). Opt-in beside `sim`: the sim image syncs `--group sim --group gpu --group
# model`; `uv sync` on the host installs neither. **`cuda-python` must stay below 13**: 13.0
# removed the `cuda.cudart` shim `base_camera.py` imports, and a missing import there does not
# fall back to the CPU, it trips an assert naming cupy. `cupy-cuda12x` because torch is cu128
# and the two share one process and one context.
gpu = [
  "cupy-cuda12x[ctk]>=14,<15",
  "PyOpenGL>=3.1,<4",
  "cuda-python>=12,<13",
]

# The AV3 model stack (Phase 4 Step 7). **Pinned to what compiled the engine**: the checkpoint's
# `models/model.json` records `torch_version 2.8.0+cu128`, and its 1.275 GB constant is a
# serialized TensorRT engine built against one TensorRT version and one SM architecture, so a
# mismatched stack does not degrade -- it fails to deserialize. torch and torch-tensorrt come
# from the cu128 index and tensorrt from NVIDIA's, both `explicit` (see `[tool.uv.sources]`).
# numpy is deliberately not pinned here.
model = [
  "torch==2.8.0",
  "torch-tensorrt==2.8.0",
  "tensorrt==10.12.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Resolve only for the platform this runs on. Linux x86_64 is the only target either the host
# or the container has ever been, and solving for the others costs time and invites failures
# from environments nobody will run.
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# torch and torch-tensorrt come from the cu128 wheel index rather than PyPI, and tensorrt from
# NVIDIA's own. `explicit = true` keeps every other dependency resolving from PyPI as before.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torch-tensorrt = { index = "pytorch-cu128" }
tensorrt = { index = "nvidia" }

[tool.hatch.build.targets.wheel]
packages = ["src/scenariobank"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The queue's own client, served verbatim by the queue server at GET /source/client.py and kept
# byte-identical so it can be diffed against a running server's copy. Linting it would mean
# editing it, and an edited copy is one we can no longer tell apart from theirs.
exclude = ["docs/queue-docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
